name: ubuntu-dist

# Builds the self-contained Linux distribution on each release architecture and
# publishes the .deb, the tarball, and the installer on an `ubuntu-v*` tag.
on:
  workflow_dispatch:
    inputs:
      target:
        description: Release target to build
        type: choice
        options:
          - both
          - linux-x64
          - linux-arm64
        default: both
  push:
    tags:
      - 'ubuntu-v*'

permissions:
  contents: read

concurrency:
  group: ubuntu-dist-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux-x64
          - runner: ubuntu-24.04-arm
            target: linux-arm64
    if: >-
      github.event_name == 'push'
      || inputs.target == 'both'
      || inputs.target == matrix.target
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: pnpm/action-setup@v5.0.0

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      - name: Build artifacts
        run: pnpm run build

      - name: Assemble runtime
        run: node --import tsx scripts/ubuntu/build-runtime.ts --target ${{ matrix.target }}

      - name: Build Debian package
        run: node --import tsx scripts/ubuntu/build-deb.ts --target ${{ matrix.target }}

      - name: Smoke-test in clean Ubuntu containers
        run: bash scripts/ubuntu/smoke.sh ${{ matrix.target }}

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: dsh-${{ matrix.target }}
          path: |
            dist/ubuntu/*.deb
            dist/ubuntu/*.tar.gz
            dist/ubuntu/VERSION
            dist/ubuntu/install.sh
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/ubuntu-v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      - name: Regenerate checksums over every tarball
        run: |
          cd artifacts
          sha256sum ./*.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --verify-tag --draft --title "$TAG" --notes 'Self-contained Linux distribution: Debian package, tarball, and installer.'
          gh release upload "$TAG" artifacts/* --clobber
          gh release edit "$TAG" --draft=false
